<html>
    <head>
        <title>Latihan Form</title>
    </head>
    <body>
        <h1>Latihan Form</h1>

        <form action="#" method="POST">
            Nama     : <input type="" name="first_name" size="50"><br>
            Umur     : <input type="number" name="umur"><br>
            jam      : <input type="time" name="jam"><br>
            Tanggal  : <input type="date" name="tanggal"><br>
            Bulan    : <input type="month" name="bulan"><br>
            Minggu   : <input type="week" name="minggu"><br>
            File     : <input type="file" name="file"><br>
            Warna    : <input type="color" name="warna"><br>
            Email    : <input type="email" email="contoh@email.com"><br>
            Password : <input type="password" name="password"><br>
            Telepon  : <input type="tel" name="telp"><br>
            Hidden   : <input type="hidden" name="ide_user" value="12345"><br>
            Volume   : <input type="range" name="volume" min="0" max="100"><br>
            Cari     : <input type="search" name="cari"><br>
            <input type="submit" value="simpan"><br> <!--button-->
            <input type="reset" value="batal"><br>
            Hobby    : <br>  
            <input type="checkbox" name="hobby[]"> Membaca <br>
            <input type="checkbox" name="hobby[]"> Bersepeda <br>
            <input type="checkbox" name="hobby[]"> Brmain Game <br>
            <input type="checkbox" name="hobby[]"> Berkebun <br>
            Jenis Kelamin : <br>
            <input type="radio" name="jenis[]"> Laki-laki <br>
            <input type="radio" name="jenis[]"> Perempuan <br>
            <input type="radio" name="jenis[]"> Rahasia <br>
            Kota Asal : <br>
            <select name="kota_asal">
                <option value="Malang"> Malang</option>
                <option value="Batu"> Batu</option>
                <option value="Kediri"> Kediri</option>
                <option value="Surabaya"> Surabaya</option>
            </select>
            Alamat Lengkap: <br>
            <textarea name="alamat" cols="50" row="5"></textarea><br>
            <input type="button" value="KLIK ME!" onclick="alert(Hallo)">
            <input type="submit" value="KIRIM">
            <input type="reset" value="RESET">
            

            </picture>
        </form>
    </body>
</html>
